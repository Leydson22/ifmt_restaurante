<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${produto.id} != null ? 'Editar Produto' : 'Cadastrar Produto'">Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4 text-center" th:text="${produto.id} != null ? 'Editar Produto' : 'Cadastrar Produto'">Cadastro de Produto</h2>
                    <form th:action="@{/produtos}" th:object="${produto}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" id="nome" th:field="*{nome}" class="form-control" required placeholder="Digite o nome do produto"/>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço (R$)</label>
                            <input type="number" step="0.01" id="preco" th:field="*{preco}" class="form-control" required placeholder="0.00"/>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
