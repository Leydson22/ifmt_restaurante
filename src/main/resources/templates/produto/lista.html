<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Lista de Produtos</h2>
        <a th:href="@{/produtos/novo}" class="btn btn-success">Novo Produto</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço (R$)</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${produtos.empty}">
                        <td colspan="5" class="text-center text-muted">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.id}">1</td>
                        <td th:text="${produto.nome}">Nome</td>
                        <td th:text="${produto.categoria}">Categoria</td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                        <td class="text-center">
                            <a th:href="@{/produtos/editar/{id}(id=${produto.id})}" class="btn btn-sm btn-primary">Editar</a>
                            <a th:href="@{/produtos/remover/{id}(id=${produto.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Deseja realmente excluir este produto?');">Excluir</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
