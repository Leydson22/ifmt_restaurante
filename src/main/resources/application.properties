spring.application.name=restaurante

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:restaurantebd}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:restaurante_user}
spring.datasource.password=${DB_PASSWORD:restaurante_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cria/atualiza as tabelas automaticamente de acordo com as entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

